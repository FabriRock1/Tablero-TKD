<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTKD - Consola del Operador Táctico</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/marcador.css">
</head>
<body class="body-combate">

    <div class="contenedor-marcador">
        <div class="bando rojo">
            <div class="columna-lateral">
                <div class="bandera" id="bandera-rojo"><img id="img-bandera-rojo" src="" style="width:100%; height:100%; object-fit:cover; border-radius:10px; display:none;"></div>
                <div class="modulo-lateral modulo-gamjeom" id="gamjeom-rojo-box"><div class="titulo-gamjeom">GAM-JEOM</div><div class="num-gamjeom" id="flt-rojo">0</div></div>
                <div class="contenedor-jueces" id="jueces-rojo-container">
                    <div class="modulo-lateral" id="j1-rojo-box"><div class="header-juez"><div class="label-modulo">J1</div></div><div class="score-modulo" id="j1-rojo-val">--</div></div>
                    <div class="modulo-lateral" id="j2-rojo-box"><div class="header-juez"><div class="label-modulo">J2</div></div><div class="score-modulo" id="j2-rojo-val">--</div></div>
                </div>
            </div>
            <div class="contenido-bando">
                <div class="nombre-competidor" id="nombre-display-rojo">HONG</div>
                <div class="rank-competidor" id="rank-display-rojo">-</div>
                <div class="pais-competidor" id="subtexto-display-rojo">-</div>
                <div class="puntos" id="pts-rojo">0</div>
                
                <div class="panel-operador-rapido">
                    <div class="fila-puntos-grid">
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('rojo', 1, 'punio')"><span class="tkd-icon icon-punio"></span><span>+1</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('rojo', 2, 'peto')"><span class="tkd-icon icon-peto"></span><span>+2</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('rojo', 3, 'casco')"><span class="tkd-icon icon-casco"></span><span>+3</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('rojo', 4, 'petogiro')"><span class="tkd-icon icon-petogiro"></span><span>+4</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('rojo', 6, 'cascogiro')"><span class="tkd-icon icon-cascogiro"></span><span>+6</span></button>
                    </div>
                    <div class="fila-rapida" style="margin-top: 8px;">
                        <button class="btn-op btn-op-gj" onclick="cambiarFalta('rojo', 1)" style="flex:2;">+ GAM-JEOM</button>
                        <button class="btn-op btn-op-sub" onclick="cambiarFalta('rojo', -1)">- GJ</button>
                        <button class="btn-op btn-op-sub" onclick="cambiarPuntosDirecto('rojo', -1, null)">-1 PT</button>
                    </div>
                </div>

                <div class="rounds-ganados-container"><div class="led-round" id="round-rojo-1"></div><div class="led-round" id="round-rojo-2"></div></div>
            </div>
        </div>

        <div class="centro">
            <div class="cabecera-centro">
                <div class="categoria-box" id="categoria-display">CATEGORÍA</div>
                <div class="round-box"><div class="round-label" id="lbl-fase">ROUND</div><div class="round-num" id="round-actual">1</div></div>
            </div>
            
            <div class="reloj-nucleo">
                <div class="tiempo" id="cronometro">00:00</div>
            </div>

            <div class="controles-centro-gamer">
                <button class="btn-control-main btn-play" id="btn-iniciar" onclick="controlarTiempo()">▶ START / PAUSE</button>
                <button class="btn-control-main btn-kyeshi" onclick="iniciarKyeShi()">⏱ TIEMPO MÉDICO</button>
                
                <div class="fila-botones-tiempo">
                    <button class="btn-sec-centro" onclick="modificarTiempo(1)">+1 SEG</button>
                    <button class="btn-sec-centro" onclick="modificarTiempo(-1)">-1 SEG</button>
                </div>
                
                <button class="btn-salir-match" onclick="window.location.href='setup.html'">[ ABANDONAR MATCH ]</button>
            </div>
        </div>

        <div class="bando azul">
            <div class="contenido-bando">
                <div class="nombre-competidor" id="nombre-display-azul">CHONG</div>
                <div class="rank-competidor" id="rank-display-azul">-</div>
                <div class="pais-competidor" id="subtexto-display-azul">-</div>
                <div class="puntos" id="pts-azul">0</div>
                
                <div class="panel-operador-rapido">
                    <div class="fila-puntos-grid">
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('azul', 1, 'punio')"><span class="tkd-icon icon-punio"></span><span>+1</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('azul', 2, 'peto')"><span class="tkd-icon icon-peto"></span><span>+2</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('azul', 3, 'casco')"><span class="tkd-icon icon-casco"></span><span>+3</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('azul', 4, 'petogiro')"><span class="tkd-icon icon-petogiro"></span><span>+4</span></button>
                        <button class="btn-op btn-pt-icon" onclick="cambiarPuntosDirecto('azul', 6, 'cascogiro')"><span class="tkd-icon icon-cascogiro"></span><span>+6</span></button>
                    </div>
                    <div class="fila-rapida" style="margin-top: 8px;">
                        <button class="btn-op btn-op-gj" onclick="cambiarFalta('azul', 1)" style="flex:2;">+ GAM-JEOM</button>
                        <button class="btn-op btn-op-sub" onclick="cambiarFalta('azul', -1)">- GJ</button>
                        <button class="btn-op btn-op-sub" onclick="cambiarPuntosDirecto('azul', -1, null)">-1 PT</button>
                    </div>
                </div>

                <div class="rounds-ganados-container"><div class="led-round" id="round-azul-1"></div><div class="led-round" id="round-azul-2"></div></div>
            </div>
            <div class="columna-lateral">
                <div class="bandera" id="bandera-azul"><img id="img-bandera-azul" src="" style="width:100%; height:100%; object-fit:cover; border-radius:10px; display:none;"></div>
                <div class="modulo-lateral modulo-gamjeom" id="gamjeom-azul-box"><div class="titulo-gamjeom">GAM-JEOM</div><div class="num-gamjeom" id="flt-azul">0</div></div>
                <div class="contenedor-jueces" id="jueces-azul-container">
                    <div class="modulo-lateral" id="j1-azul-box"><div class="header-juez"><div class="label-modulo">J1</div></div><div class="score-modulo" id="j1-azul-val">--</div></div>
                    <div class="modulo-lateral" id="j2-azul-box"><div class="header-juez"><div class="label-modulo">J2</div></div><div class="score-modulo" id="j2-azul-val">--</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-round">
        <div class="modal-box" style="max-width: 750px; width: 95%;">
            <div class="modal-titulo" id="modal-r-titulo">ROUND TERMINADO</div>
            <div id="modal-r-ganador">GANADOR</div>
            <div class="modal-criterio" id="modal-r-criterio">Criterio.</div>
            
            <div class="tabla-estadisticas" id="contenedor-estadisticas">
                <div class="stat-header"><div>HONG</div><div>ESTADÍSTICAS</div><div>CHONG</div></div>
                <div class="stat-row stat-total"><div class="stat-r-val" id="st-pt-r">0</div><div>PUNTOS NETOS</div><div class="stat-a-val" id="st-pt-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-pu-r">0</div><div class="stat-icon-wrapper"><span class="tkd-icon icon-punio"></span></div><div class="stat-a-val" id="st-pu-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-pe-r">0</div><div class="stat-icon-wrapper"><span class="tkd-icon icon-peto"></span></div><div class="stat-a-val" id="st-pe-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-pg-r">0</div><div class="stat-icon-wrapper"><span class="tkd-icon icon-petogiro"></span></div><div class="stat-a-val" id="st-pg-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-ca-r">0</div><div class="stat-icon-wrapper"><span class="tkd-icon icon-casco"></span></div><div class="stat-a-val" id="st-ca-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-cg-r">0</div><div class="stat-icon-wrapper"><span class="tkd-icon icon-cascogiro"></span></div><div class="stat-a-val" id="st-cg-a">0</div></div>
                <div class="stat-row"><div class="stat-r-val" id="st-gj-r">0</div><div>FALTAS RECIBIDAS</div><div class="stat-a-val" id="st-gj-a">0</div></div>
            </div>
            <div id="contenedor-voto-manual" style="display: none; margin: 20px 0;">
                <div style="display: flex; gap: 15px; width: 100%;">
                    <button class="btn-voto-rojo" onclick="asignarGanadorManual('rojo')">DECLARAR VICTORIA HONG</button>
                    <button class="btn-voto-azul" onclick="asignarGanadorManual('azul')">DECLARAR VICTORIA CHONG</button>
                </div>
            </div>
            
            <button id="btn-modal-accion" class="btn-iniciar-gigante" onclick="avanzarSiguientePaso()" style="width: 100%; margin-top: 10px;">AVANZAR / CONTINUAR</button>
        </div>
    </div>

    <script src="js/combate_engine.js"></script>
</body>
</html>
